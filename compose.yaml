services:
  web:
    build: .
    ports:
      - "${CAMPUS_HTTP_BIND:-127.0.0.1}:${CAMPUS_HTTP_PORT:-8080}:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campus_jobs
      DB_USER: campus_jobs_app
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_jobs
      MYSQL_USER: campus_jobs_app
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM JOB LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
